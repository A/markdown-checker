[package]
name = "markdown-checker"
version = "0.1.3"
edition = "2021"
description = "Deterministic spec checker for markdown documents — declare required structure in YAML, get exact line-level violations"
license = "MIT"
repository = "https://github.com/A/markdown-checker"
readme = "README.md"
keywords = ["markdown", "linter", "validator", "cli", "spec"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "mdcheck"
path = "src/lib.rs"

[[bin]]
name = "mdcheck"
path = "src/main.rs"
required-features = ["cli"]

# The tests that run the `mdcheck` binary. Without the `cli` feature the library and every other
# test still builds and runs.
[[test]]
name = "cli_tests"
required-features = ["cli"]

[[test]]
name = "dogfood"
required-features = ["cli"]

[[test]]
name = "snapshot_tests"
required-features = ["cli"]

[dependencies]
# No default features: comrak's own CLI (clap, xdg) and its syntax highlighter (syntect with onig,
# plist) belong to the binary, and a library that only reads the document tree must not pull them.
comrak = { version = "0.54", default-features = false }
serde-saphyr = "=0.0.29"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }

[features]
# The `mdcheck` binary and the tests that run it: the argument parser is all the library lacks.
# On by default so `cargo install markdown-checker` still builds `mdcheck`; a library user opts
# out with `default-features = false`.
default = ["cli"]
cli = ["dep:clap"]

[dependencies.clap]
version = "4.6"
features = ["derive"]
optional = true

[dev-dependencies]
insta = "1.48"
assert_cmd = "2.2"
predicates = "3.1"
